; ESP32 Synth - acordes + arpejador com saida I2S (PCM5102A)
; Se sua placa nao for a generica (ex: ESP32-S3), troque o "board" abaixo.
;
; Ambientes de teste (bring-up), um por subsistema, pra testar a fiacao aos
; poucos em vez de tudo de uma vez. Use assim:
;   pio run -e test_i2s      -t upload   (testa PCM5102A)
;   pio run -e test_lcd      -t upload   (testa display LCD I2C)
;   pio run -e test_keypad   -t upload   (testa matriz 4x4)
;   pio run -e test_joystick -t upload   (testa joystick + potenciometros)
;   pio run -e esp32dev      -t upload   (firmware completo, o sintetizador de verdade)

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

[env:esp32dev]
build_src_filter =
    +<*>
    -<bringup_i2s.cpp>
    -<bringup_lcd.cpp>
    -<bringup_keypad.cpp>
    -<bringup_joystick.cpp>

[env:test_i2s]
build_src_filter =
    +<*>
    -<main.cpp>
    -<bringup_lcd.cpp>
    -<bringup_keypad.cpp>
    -<bringup_joystick.cpp>

[env:test_lcd]
build_src_filter =
    +<*>
    -<main.cpp>
    -<bringup_i2s.cpp>
    -<bringup_keypad.cpp>
    -<bringup_joystick.cpp>

[env:test_keypad]
build_src_filter =
    +<*>
    -<main.cpp>
    -<bringup_i2s.cpp>
    -<bringup_lcd.cpp>
    -<bringup_joystick.cpp>

[env:test_joystick]
build_src_filter =
    +<*>
    -<main.cpp>
    -<bringup_i2s.cpp>
    -<bringup_lcd.cpp>
    -<bringup_keypad.cpp>
